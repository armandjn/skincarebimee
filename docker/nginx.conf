server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    include /etc/nginx/snippets/security-headers.conf;

    # Compression
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Form + admin API (Node container)
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        client_max_body_size 32k;
        proxy_read_timeout 15s;
        add_header Cache-Control "no-store";
    }

    # Admin panel page: never cached or indexed
    location = /admin {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files /admin.html =404;
    }

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    # Legacy Wix URLs -> new flat pages
    location = /home { return 301 /; }
    location = /skin-care { return 301 /services; }
    location = /eye-brow { return 301 /service-lip-and-eye-treatment; }
    location ~ ^/services/(.+)$ { return 301 /service-$1; }
    location ~ ^/service-page/(.+)$ { return 301 /service-$1; }
    location ~ ^/category/ { return 301 /shop; }

    # Static assets: long cache
    location ~* \.(?:css|js|jpg|jpeg|png|webp|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Clean URLs: /about -> about.html
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri.html $uri/ =404;
    }

    # Server-side form endpoints exist only on the Cloudflare deployment.
    # Here they return 404 and the site falls back to a pre-filled email.
    error_page 404 /404.html;
}
